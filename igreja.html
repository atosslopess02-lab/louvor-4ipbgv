<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Equipe de Louvor</title>
<script src="config.js"></script>
<style>
:root{--bg:#f4f6f5;--surface:#fff;--ink:#1f2a24;--muted:#5f6b64;--cor:#4f7a5c;--line:#dde3df}
@media (prefers-color-scheme:dark){:root{--bg:#141816;--surface:#1d2320;--ink:#e6ece8;--muted:#9fb0a6;--line:#2f3833}}
:root{--soft:color-mix(in srgb,var(--cor) 14%,var(--surface))}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--cor)}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
header{background:var(--surface);border-top:6px solid var(--cor);border-bottom:1px solid var(--line)}
header .wrap{display:flex;gap:16px;align-items:center;padding-top:20px;padding-bottom:20px}
header img{width:64px;height:64px;object-fit:contain;flex:none}
header h1{margin:0;font-size:clamp(1.4rem,3.4vw,2rem);line-height:1.15}
header p{margin:2px 0 0;color:var(--muted)}
nav{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:6px;overflow-x:auto;padding-top:8px;padding-bottom:8px}
nav a{white-space:nowrap;text-decoration:none;color:var(--ink);font-weight:700;font-size:.92rem;padding:7px 12px;border-radius:999px}
nav a:hover{background:var(--soft)}
section{padding:30px 0 6px}
h2{margin:0 0 4px;font-size:1.45rem}
.lead{color:var(--muted);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--cor)}
ol.lit{margin:8px 0 0;padding-left:22px}
ol.lit li{padding:2px 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools input,.tools select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;min-height:42px}
.tools input{flex:1;min-width:220px}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-size:.85rem}
td .art{color:var(--muted);font-size:.88rem}
.tag{display:inline-block;background:var(--soft);color:var(--ink);border-radius:999px;padding:1px 9px;margin:1px 2px;font-size:.78rem;font-weight:700}
.lk a{font-weight:700;margin-right:10px;white-space:nowrap}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:.85rem;padding:30px 0 40px;text-align:center}
.erro{padding:60px 0;text-align:center}
@media (max-width:640px){thead{display:none}tr{display:block;border-bottom:1px solid var(--line);padding:8px 4px}td{display:block;border:0;padding:3px 8px}}
</style>
</head>
<body>
<div id="app"><div class="wrap erro"><p class="empty">Carregando…</p></div></div>
<script>
(async () => {
  const C = (window.LOUVOR_CONFIG || {}).firebase || {};
  const slug = new URLSearchParams(location.search).get('i') || '';
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const app = document.getElementById('app');
  const base = `https://firestore.googleapis.com/v1/projects/${C.projectId}/databases/(default)/documents/igrejas/${encodeURIComponent(slug)}`;
  /* converte o formato do Firestore REST em objeto comum */
  const val = v => v.stringValue ?? v.integerValue ?? v.booleanValue ?? (v.arrayValue ? (v.arrayValue.values || []).map(val) : v.mapValue ? obj(v.mapValue.fields || {}) : null);
  const obj = f => Object.fromEntries(Object.entries(f).map(([k, v]) => [k, val(v)]));
  let G, MUS = [], PROX = [], QUEST = null, MEMB = [];
  try {
    const [g, m] = await Promise.all([fetch(`${base}?key=${C.apiKey}`), fetch(`${base}/dados/musicas?key=${C.apiKey}`)]);
    if (!slug || !g.ok) throw 0;
    G = obj((await g.json()).fields);
    if (m.ok) MUS = obj((await m.json()).fields || {}).lista || [];
    /* escala e repertório deste mês e do próximo */
    const hoje = new Date(), p2 = n => String(n).padStart(2, '0');
    const meses = [0, 1].map(k => { const d = new Date(hoje.getFullYear(), hoje.getMonth() + k, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); });
    const pega = async id => { try { const r = await fetch(`${base}/dados/${id}?key=${C.apiKey}`); return r.ok ? (obj((await r.json()).fields || {}).lista || []) : []; } catch (e) { return []; } };
    const [e1, e2, r1, r2] = await Promise.all([pega('escala-' + meses[0]), pega('escala-' + meses[1]), pega('repertorio-' + meses[0]), pega('repertorio-' + meses[1])]);
    /* questionário de disponibilidade aberto agora */
    const doc1 = async id => { try { const r = await fetch(`${base}/dados/${id}?key=${C.apiKey}`); return r.ok ? obj((await r.json()).fields || {}) : null; } catch (e) { return null; } };
    const hojeQ = hoje.getFullYear() + '-' + p2(hoje.getMonth() + 1) + '-' + p2(hoje.getDate());
    const qs = await Promise.all([meses[0], meses[1], (() => { const d = new Date(hoje.getFullYear(), hoje.getMonth() + 2, 1); return d.getFullYear() + '-' + p2(d.getMonth() + 1); })()].map(m => doc1('quest-' + m)));
    QUEST = qs.find(q => q && q.abre <= hojeQ && q.fecha >= hojeQ) || null;
    if (QUEST) { const eq = await doc1('equipe'); MEMB = ((eq && eq.membros) || []).map(m => m.nome).filter(Boolean); }
    const hojeS = hoje.getFullYear() + '-' + p2(hoje.getMonth() + 1) + '-' + p2(hoje.getDate());
    const k = x => x.data + '|' + x.culto, cultos = {};
    [...e1, ...e2].forEach(x => { cultos[k(x)] = { data: x.data, culto: x.culto, hora: x.hora || '', folga: !!x.folga, p: x.p || [], itens: [] }; });
    [...r1, ...r2].forEach(x => { const c = cultos[k(x)] = cultos[k(x)] || { data: x.data, culto: x.culto, hora: x.hora || '', folga: false, p: [] }; c.itens = (x.itens || []).filter(i => i.t); });
    PROX = Object.values(cultos).filter(c => c.data >= hojeS && !c.folga && (c.p.length || c.itens.length)).sort((a, b) => (a.data + a.hora).localeCompare(b.data + b.hora));
  } catch (e) {
    app.innerHTML = '<div class="wrap erro"><h2>Igreja não encontrada</h2><p class="empty">Confira o endereço que você recebeu.</p></div>'; return;
  }
  document.documentElement.style.setProperty('--cor', G.cor || '#4f7a5c');
  document.title = (G.equipe || 'Equipe de Louvor') + ' · ' + (G.igreja || '');
  MUS.sort((a, b) => a.t.localeCompare(b.t, 'pt'));
  const DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
  const fmtData = d => { const [a, m, dd] = d.split('-').map(Number); return DIAS[new Date(a, m - 1, dd).getDay()] + ', ' + String(dd).padStart(2, '0') + '/' + String(m).padStart(2, '0'); };
  const agrupa = p => { const o = []; p.forEach(z => { const g = o.find(x => x[0] === z.f); g ? g[1].push(z.n) : o.push([z.f, [z.n]]); }); return o; };
  const acha = t => MUS.find(m => norm(m.t) === norm(t));
  const linksMus = t => { const m = acha(t) || { t }; const yt = m.yt || ('https://www.youtube.com/results?search_query=' + encodeURIComponent(t + ' ' + (m.art || ''))); const cc = m.cc || ('https://www.cifraclub.com.br/?q=' + encodeURIComponent(t + ' ' + (m.art || ''))); return ` <a href="${esc(yt)}" target="_blank" rel="noopener" title="YouTube">▶️</a> <a href="${esc(cc)}" target="_blank" rel="noopener" title="Cifra">🎸</a>`; };
  const cartao = c => `<div class="card"><div class="eyebrow">${fmtData(c.data)} · ${esc(c.culto)}${c.hora ? ' · ' + esc(c.hora) : ''}</div>
    ${c.itens.length ? `<ol class="lit">${c.itens.map(i => `<li><span class="art">${esc(i.mo)}:</span> <b>${esc(i.t)}</b>${linksMus(i.t)}</li>`).join('')}</ol>` : '<p class="empty">Repertório ainda não publicado.</p>'}
    ${c.p.length ? `<p style="margin:10px 0 0;font-size:.9rem">${agrupa(c.p).map(([f, ns]) => `<b>${esc(f)}:</b> ${esc(ns.join(', '))}`).join(' · ')}</p>` : ''}</div>`;
  const MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  const slug2 = t => norm(t).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 80);
  const formDisp = () => `<section id="disponibilidade"><h2>Disponibilidade para a escala de ${MESES[+QUEST.mes.slice(5) - 1]}</h2>
    <p class="lead">Marque os dias em que você pode servir e onde pode ser escalado. Aberto até ${QUEST.fecha.split('-').reverse().join('/')}. Se responder de novo com o mesmo nome, a resposta anterior é trocada.</p>
    <form class="card" id="f-disp" style="display:grid;gap:14px;max-width:640px">
      <label style="display:grid;gap:4px;font-weight:700">Nome completo<input id="dp-nome" list="dp-membros" required minlength="5" maxlength="100" autocomplete="name" style="font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)"></label>
      <datalist id="dp-membros">${MEMB.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <fieldset style="border:1px solid var(--line);border-radius:10px"><legend><b>Dias em que posso</b></legend>${(QUEST.datas || []).map(d => `<label style="display:flex;gap:8px;align-items:center;padding:4px 0"><input type="checkbox" name="dp-d" value="${d.data}"> ${fmtData(d.data)}${d.rotulo ? ' · ' + esc(d.rotulo) : ''}</label>`).join('')}</fieldset>
      <fieldset style="border:1px solid var(--line);border-radius:10px"><legend><b>Onde posso ser escalado</b></legend>${(QUEST.funcoes || []).map(f => `<label style="display:flex;gap:8px;align-items:center;padding:4px 0"><input type="checkbox" name="dp-f" value="${esc(f)}"> ${esc(f)}</label>`).join('')}</fieldset>
      <button type="submit" style="font:inherit;font-weight:700;background:var(--cor);color:#fff;border:0;border-radius:999px;padding:12px 18px;cursor:pointer">Enviar minha disponibilidade</button>
      <p id="dp-msg" class="empty" style="margin:0"></p>
    </form></section>`;
  const enviaDisp = async e => {
    e.preventDefault();
    const nome = document.getElementById('dp-nome').value.replace(/\s+/g, ' ').trim(), m = document.getElementById('dp-msg');
    const datas = [...document.querySelectorAll('input[name=dp-d]:checked')].map(i => i.value), funcoes = [...document.querySelectorAll('input[name=dp-f]:checked')].map(i => i.value);
    if (nome.split(' ').length < 2) { m.textContent = 'Escreva o nome completo.'; return; }
    if (!datas.length) { m.textContent = 'Marque pelo menos um dia.'; return; }
    const chave = slug2(nome), arr = a => ({ arrayValue: { values: a.map(v => ({ stringValue: v })) } });
    const body = { fields: { mes: { stringValue: QUEST.mes }, chave: { stringValue: chave }, nome: { stringValue: nome }, datas: arr(datas), funcoes: arr(funcoes), atualizado: { timestampValue: new Date().toISOString() } } };
    m.textContent = 'Enviando…';
    try {
      const r = await fetch(`${base}/respostas/${encodeURIComponent(QUEST.mes + '__' + chave)}?key=${C.apiKey}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      m.textContent = r.ok ? '✅ Recebido! Obrigado, ' + nome.split(' ')[0] + '.' : 'Não consegui enviar agora. O questionário pode ter fechado. Tente de novo ou fale com o administrador.';
    } catch (err) { m.textContent = 'Sem conexão. Tente de novo.'; }
  };
  const momentos = [...new Set((G.liturgia || []).flatMap(c => c.momentos))].filter(m => !/am[eé]m/i.test(m));
  app.innerHTML = `
  <header><div class="wrap">${G.logo ? `<img src="${G.logo}" alt="Logo da ${esc(G.igreja)}">` : ''}
    <div><h1>${esc(G.equipe || 'Equipe de Louvor')}</h1><p>${esc(G.igreja)}${G.cidade ? ' · ' + esc(G.cidade) : ''}</p></div></div></header>
  <nav><div class="wrap">${QUEST ? '<a href="#disponibilidade">🗓️ Disponibilidade</a>' : ''}<a href="#domingo">Próximos cultos</a><a href="#escala">Escala</a><a href="#liturgia">Liturgia</a><a href="#repertorio">Repertório</a></div></nav>
  <main class="wrap">
    ${QUEST ? formDisp() : ''}
    <section id="domingo"><h2>Próximos cultos</h2><p class="lead">Quem está escalado e o que vamos cantar.</p>
      ${PROX.length ? `<div class="grid">${PROX.slice(0, 3).map(cartao).join('')}</div>` : '<div class="card"><p class="empty" style="margin:0">A escala e o repertório dos próximos cultos ainda não foram publicados.</p></div>'}</section>
    <section id="escala"><h2>Escala</h2><p class="lead">Escala deste mês e do próximo.</p>
      ${PROX.some(c => c.p.length) ? `<div style="overflow-x:auto"><table><thead><tr><th>Culto</th><th>Equipe</th></tr></thead><tbody>${PROX.filter(c => c.p.length).map(c => `<tr><td><b>${fmtData(c.data)}</b><div class="art">${esc(c.culto)}${c.hora ? ' · ' + esc(c.hora) : ''}</div></td><td>${agrupa(c.p).map(([f, ns]) => `<span class="tag">${esc(f)}</span> ${esc(ns.join(', '))}`).join('<br>')}</td></tr>`).join('')}</tbody></table></div>` : '<div class="card"><p class="empty" style="margin:0">A escala ainda não foi publicada.</p></div>'}</section>
    <section id="liturgia"><h2>Liturgia</h2><p class="lead">A ordem dos momentos em cada culto.</p>
      <div class="grid">${(G.liturgia || []).map(c => `<div class="card"><div class="eyebrow">${esc(c.nome)}</div>${c.dia !== undefined && c.dia !== null ? `<p class="art" style="margin:2px 0 0">${DIAS[+c.dia]}${c.hora ? ' · ' + esc(c.hora) : ''}</p>` : ''}<ol class="lit">${c.momentos.map(m => `<li>${esc(m)}</li>`).join('')}</ol></div>`).join('')}</div></section>
    <section id="repertorio"><h2>Repertório</h2><p class="lead">Busque pelo nome ou artista e filtre pelo momento do culto. Cada música tem o vídeo de referência e a cifra.</p>
      <div class="tools"><input id="q" type="search" placeholder="Buscar música ou artista" aria-label="Buscar música ou artista">
        <select id="fm" aria-label="Filtrar por momento"><option value="">Todos os momentos</option>${momentos.map(m => `<option>${esc(m)}</option>`).join('')}</select></div>
      <p class="empty" id="cont"></p>
      <table><thead><tr><th>Música</th><th>Momentos</th><th>Links</th></tr></thead><tbody id="tb"></tbody></table></section>
  </main>
  <footer>${esc(G.equipe || 'Equipe de Louvor')} · ${esc(G.igreja)}</footer>`;
  const desenha = () => {
    const q = norm(document.getElementById('q').value), fm = document.getElementById('fm').value;
    const rows = MUS.filter(m => (!q || norm(m.t + ' ' + m.art).includes(q)) && (!fm || (m.m || []).includes(fm)));
    document.getElementById('cont').textContent = `${rows.length} de ${MUS.length} músicas`;
    document.getElementById('tb').innerHTML = rows.map(m => `<tr><td><b>${esc(m.t)}</b><div class="art">${esc(m.art)}</div></td>
      <td>${(m.m || []).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</td>
      <td class="lk">${m.yt ? `<a href="${esc(m.yt)}" target="_blank" rel="noopener">▶️ YouTube</a>` : ''}<a href="${esc(m.cc || ('https://www.cifraclub.com.br/?q=' + encodeURIComponent(m.t + ' ' + (m.art || ''))))}" target="_blank" rel="noopener">🎸 Cifra</a></td></tr>`).join('')
      || '<tr><td colspan="3" class="empty">Nenhuma música encontrada.</td></tr>';
  };
  if (QUEST) document.getElementById('f-disp').onsubmit = enviaDisp;
  document.getElementById('q').oninput = desenha; document.getElementById('fm').onchange = desenha; desenha();
})();
</script>
</body>
</html>
